[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "EmotionDetection"
version = "0.1.0"
description = "Emotion detection using Watson NLP service"
requires-python = ">=3.10"
dependencies = [
    "requests",
]

[tool.setuptools.packages.find]
where = ["src"]